<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklisten">
<meta name="theme-color" content="#1f4e79">
<title>B&amp;S Checklisten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>
<header id="bar"><button id="back" class="hdrbtn">‹ Projekte</button><h1 id="title">Bauvorhaben</h1><span class="hdrbtn sp"></span></header>
<div id="sync" class="sync" hidden role="button"></div>
<main id="main"></main>
<dialog id="dlg"><form method="dialog" id="newForm">
<h2>Neues Bauvorhaben</h2>
<label>Name<input name="name" required placeholder="z. B. BV Peters"></label>
<label>Adresse (optional)<input name="addr" placeholder="Straße, PLZ Ort"></label>
<fieldset><legend>Checkliste</legend>
<label class="radio"><input type="radio" name="tpl" value="ohne" checked> Haus ohne Keller</label>
<label class="radio"><input type="radio" name="tpl" value="mit"> Haus mit Keller</label></fieldset>
<div class="row"><button value="cancel" formnovalidate class="sec">Abbrechen</button><button value="ok" class="pri">Anlegen</button></div>
</form></dialog>
<input type="file" id="bkFile" accept=".json,application/json" hidden>
<dialog id="acct"></dialog>
<dialog id="choice"><form method="dialog"><h2>Daten zusammenführen</h2><p></p>
<div class="row"><button value="merge" class="pri">Zusammenführen</button></div>
<div class="row"><button value="remote" class="sec">Nur Cloud-Stand</button><button value="local" class="sec">Nur dieses Gerät</button></div>
<p class="muted">„Zusammenführen“ behält alle Bauvorhaben und Haken von beiden Seiten. Bei „Nur Cloud-Stand“ bzw. „Nur dieses Gerät“ wird der jeweils andere Stand verworfen.</p>
<div class="row"><button value="cancel" class="sec">Abbrechen (abmelden)</button></div></form></dialog>
<script src="config.js"></script><script src="data.js"></script><script src="backup.js"></script><script src="sync.js"></script><script src="bzp.js"></script><script src="app.js"></script>
</body></html>
